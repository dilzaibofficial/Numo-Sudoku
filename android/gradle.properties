org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Project lives on D:, Gradle/pub caches live on C: — Kotlin's incremental
# compiler crashes trying to compute a relative path across drive letters
# on Windows ("this and base files have different roots"). Disabling
# incremental compilation avoids that path computation entirely; full
# recompiles are slower but reliable. Safe to re-enable if the project is
# ever moved to the same drive as the caches.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
